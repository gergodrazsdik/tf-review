---
name: tf-review

# Reviews a PR's OpenTofu or Terraform plan in two jobs (D21 in docs/plan.md). The plan job runs code the PR
# controls, so it gets the plan identity and only passes on a redacted result. The review job runs
# no PR code, and hands that result to the review service, which answers on the PR through its GitHub App
# (D38). Callers pin this file to a released commit's full SHA (D45), grant contents: read, id-token: write and
# pull-requests: write, and pass the secrets below, with secrets: inherit for same-owner repos.
on:
  workflow_call:
    inputs:
      working-directory:
        description: The project to plan. Its name also sets the state key.
        type: string
        default: infra
      tool:
        description: What plans the project, opentofu or terraform. A project's lock file has to be from the same tool.
        type: string
        default: opentofu
      config-path:
        description: Path of the config, read from the PR's base commit so a PR can't weaken its own review.
        type: string
        default: .tf-review.yml
      image:
        description: Review image by digest. Only tf-review's signed release and dev packages are accepted.
        type: string
        default: ghcr.io/gergodrazsdik/tf-review@sha256:de4023f14f5a9ffeea73597644a24fdf51ec3d5ba5b8bebe82cb41f75b0f7e7b
      api-url:
        description: The review service.
        type: string
        default: https://ca-tf-review-api-prod.yellowpebble-7ff92100.germanywestcentral.azurecontainerapps.io
    secrets:
      AZURE_CLIENT_ID_PLAN:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      PLAN_VARIABLES:
        description: The project's required variables, as a JSON object. Bootstrap sets it where a project needs one.
        required: false

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image }}

jobs:
  plan:
    # Fork PRs get no OIDC token or secrets, so they can't reach Azure or the model.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Queued, not cancelled: a superseded plan still gets its review dropped by the service.
    concurrency:
      group: tf-review-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PROJECT: ${{ inputs.working-directory }}
      TOOL: ${{ inputs.tool }}
      # Stops Terraform calling HashiCorp's version check. It has no effect on OpenTofu.
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Choose the tool
        run: |
          case $TOOL in
            opentofu) echo "BIN=tofu" >>"$GITHUB_ENV" ;;
            terraform) echo "BIN=terraform" >>"$GITHUB_ENV" ;;
            *)
              echo "The tool must be opentofu or terraform." >&2
              exit 1
              ;;
          esac
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Before any PR code runs, so PR code can't interfere with the check.
      - &verify-image
        name: Verify the image
        run: |
          case $IMAGE in
            ghcr.io/gergodrazsdik/tf-review@sha256:*) workflow='release\.yml@refs/tags/image-v.*' ;;
            ghcr.io/gergodrazsdik/tf-review-dev@sha256:*) workflow='dev-image\.yml@refs/heads/.*' ;;
            *)
              echo "The image must be tf-review or tf-review-dev, by digest." >&2
              exit 1
              ;;
          esac
          workflows='^https://github\.com/gergodrazsdik/tf-review/\.github/workflows'
          cosign verify --output text \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$workflows/$workflow\$" \
            "$IMAGE" >/dev/null
          docker pull --quiet "$IMAGE"
      - name: Read the tool version from the base commit
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$BASE_SHA" 2>/dev/null \
            | yq '.tool_version // ""' || true)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$TOOL" = terraform ]; then
              version=1.17.1
            else
              version=1.13.2
            fi
          fi
          echo "tool-version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: inputs.tool == 'opentofu'
        with:
          tofu_version: ${{ steps.config.outputs.tool-version }}
          tofu_wrapper: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: inputs.tool == 'terraform'
        with:
          terraform_version: ${{ steps.config.outputs.tool-version }}
          terraform_wrapper: false
      - name: Init
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          "$BIN" -chdir="$PROJECT" init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=${PROJECT##*/}.tfstate" \
            -backend-config="use_azuread_auth=true"
      # Without the state lock, because this plan is only reviewed, never applied, and PRs plan at the same time (D48).
      # PLAN_VARIABLES gives the project's required variables. PR code can read them while it plans, like the
      # plan identity, so they hold IDs, never credentials.
      - name: Plan
        env:
          PLAN_VARIABLES: ${{ secrets.PLAN_VARIABLES }}
        run: |
          args=()
          if [ -n "$PLAN_VARIABLES" ]; then
            vars="$RUNNER_TEMP/plan-variables.tfvars.json"
            if ! printf '%s' "$PLAN_VARIABLES" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "PLAN_VARIABLES must be a JSON object of variable names and values." >&2
              exit 1
            fi
            printf '%s' "$PLAN_VARIABLES" >"$vars"
            args=(-var-file="$vars")
          fi
          status=0
          "$BIN" -chdir="$PROJECT" plan -input=false -no-color -lock=false "${args[@]}" \
            -out="$RUNNER_TEMP/out.tfplan" || status=$?
          rm -f "$RUNNER_TEMP/plan-variables.tfvars.json"
          exit "$status"
      - name: Redact
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          "$BIN" -chdir="$PROJECT" show -json "$RUNNER_TEMP/out.tfplan" >"$work/plan.json"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            "$IMAGE" redact /work/plan.json /work/redacted.json
          rm -f "$work/plan.json" "$RUNNER_TEMP/out.tfplan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tf-review-plan
          path: ${{ runner.temp }}/tf-review/redacted.json
          retention-days: 1
          if-no-files-found: error

  review:
    needs: plan
    # Runs even when the plan failed, so the PR always gets a result for this commit. It isn't a
    # required check, so an outage can't block merges (D9).
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The API only accepts a token from this environment, which the plan job doesn't have (D45).
    environment: review
    # Cancelled when superseded. The service also drops any review of a commit no longer at the PR's head.
    concurrency:
      group: tf-review-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Again here: this runner never ran PR code, so this check can't have been tampered with.
      - *verify-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tf-review-plan
          path: ${{ runner.temp }}/tf-review
      # The service reads the config itself, at the base commit, so a PR can't weaken its own review.
      - name: Submit
        id: submit
        continue-on-error: true
        env:
          TF_REVIEW_API_URL: ${{ inputs.api-url }}
          CONFIG_PATH: ${{ inputs.config-path }}
          # So the service can read the project's lock file at the base commit, for its provider version.
          PROJECT: ${{ inputs.working-directory }}
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            -e HOME=/tmp -e TF_REVIEW_API_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            "$IMAGE" submit /work/redacted.json "$COMMIT" "$CONFIG_PATH" "$PROJECT"
      # With its own token and no result, which says "not reviewed", so an older result can't stand for this
      # commit (D39). A re-run reviews it once the service is back.
      - name: Say not reviewed
        if: ${{ !cancelled() && steps.submit.outcome != 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_API_URL -e PR_NUMBER \
            "$IMAGE" publish /work/no-result.json /work/redacted.json "$COMMIT"
