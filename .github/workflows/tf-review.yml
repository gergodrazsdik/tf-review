---
name: tf-review

# Reviews a PR's OpenTofu plan in two jobs (D21 in docs/plan.md). The plan job runs code the PR
# controls, so it gets the plan identity and only passes on a redacted result. The review job runs
# no PR code and treats that result as untrusted. Callers grant contents: read, id-token: write and
# pull-requests: write, and pass the secrets below, with secrets: inherit for same-owner repos.
on:
  workflow_call:
    inputs:
      working-directory:
        description: The OpenTofu project to plan. Its name also sets the state key.
        type: string
        default: infra
      config-path:
        description: Path of the config, read from the PR's base commit so a PR can't weaken its own review.
        type: string
        default: .tf-review.yml
      image:
        description: Review image by digest. Only tf-review's signed release and dev packages are accepted.
        type: string
        default: ghcr.io/gergodrazsdik/tf-review@sha256:5c4b23a5c2468bae0f24613ff9bd2e6e21f41ef3c9d027a968140c88a4c29ccb
    secrets:
      AZURE_CLIENT_ID_PLAN:
        required: true
      AZURE_CLIENT_ID_REVIEW:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image }}

jobs:
  plan:
    # Fork PRs get no OIDC token or secrets, so they can't reach Azure or the model.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Queued, not cancelled: cancelling a plan mid-run could leave the state locked.
    concurrency:
      group: tf-review-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PROJECT: ${{ inputs.working-directory }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Before any PR code runs, so PR code can't interfere with the check.
      - &verify-image
        name: Verify the image
        run: |
          case $IMAGE in
            ghcr.io/gergodrazsdik/tf-review@sha256:*) workflow='release\.yml@refs/tags/image-v.*' ;;
            ghcr.io/gergodrazsdik/tf-review-dev@sha256:*) workflow='dev-image\.yml@refs/heads/.*' ;;
            *)
              echo "The image must be tf-review or tf-review-dev, by digest." >&2
              exit 1
              ;;
          esac
          workflows='^https://github\.com/gergodrazsdik/tf-review/\.github/workflows'
          cosign verify --output text \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$workflows/$workflow\$" \
            "$IMAGE" >/dev/null
          docker pull --quiet "$IMAGE"
      - name: Read the OpenTofu version from the base commit
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$BASE_SHA" 2>/dev/null \
            | yq '.tool_version // ""' || true)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version=1.13.2
          fi
          echo "tool-version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.config.outputs.tool-version }}
          tofu_wrapper: false
      - name: Init
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          tofu -chdir="$PROJECT" init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=${PROJECT##*/}.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: Plan
        run: tofu -chdir="$PROJECT" plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/out.tfplan"
      - name: Redact
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          tofu -chdir="$PROJECT" show -json "$RUNNER_TEMP/out.tfplan" >"$work/plan.json"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            "$IMAGE" redact /work/plan.json /work/redacted.json
          rm -f "$work/plan.json" "$RUNNER_TEMP/out.tfplan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tf-review-plan
          path: ${{ runner.temp }}/tf-review/redacted.json
          retention-days: 1
          if-no-files-found: error

  review:
    needs: plan
    # Runs even when the plan failed, so the PR always gets a result for this commit. It isn't a
    # required check, so a model outage can't block merges (D9).
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: review
    # Cancelled when superseded, so an older run can't overwrite a newer comment.
    concurrency:
      group: tf-review-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Again here: this runner never ran PR code, so this check can't have been tampered with.
      - *verify-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tf-review-plan
          path: ${{ runner.temp }}/tf-review
      - name: Read the config from the base commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$BASE_SHA" >"$work/config.yml"
      # The image has no az, so DefaultAzureCredential uses workload identity through this file. If this
      # fails, the agent reports "not reviewed" and the policy findings still get posted.
      - name: Get a federated token
        continue-on-error: true
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/federated-token"
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::$token"
          printf '%s' "$token" >"$RUNNER_TEMP/federated-token"
      - name: Review
        continue-on-error: true
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_REVIEW }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_REVIEW_OPENAI_ENDPOINT: ${{ vars.TF_REVIEW_OPENAI_ENDPOINT }}
          TF_REVIEW_OPENAI_DEPLOYMENT: ${{ vars.TF_REVIEW_OPENAI_DEPLOYMENT }}
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          touch "$RUNNER_TEMP/federated-token"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            -e HOME=/tmp -e AZURE_CLIENT_ID -e AZURE_TENANT_ID \
            -e AZURE_FEDERATED_TOKEN_FILE=/run/federated-token \
            -e TF_REVIEW_OPENAI_ENDPOINT -e TF_REVIEW_OPENAI_DEPLOYMENT \
            -v "$RUNNER_TEMP/federated-token:/run/federated-token:ro" \
            "$IMAGE" review /work/redacted.json /work/config.yml /work/result.json "$COMMIT"
      - name: Publish
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          work="$RUNNER_TEMP/tf-review"
          mkdir -p "$work"
          docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$work:/work" \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_API_URL -e PR_NUMBER \
            -e GITHUB_STEP_SUMMARY=/work/summary.md \
            "$IMAGE" publish /work/result.json /work/redacted.json "$COMMIT"
          if [ -f "$work/summary.md" ]; then
            cat "$work/summary.md" >>"$GITHUB_STEP_SUMMARY"
          fi
