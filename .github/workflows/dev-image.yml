---
name: dev-image

# Publishes an unreleased image for tandem development with tf-review-demo: run it on a branch,
# and pass the digest it prints through the reusable workflow's image input. It's a separate
# package with its own signing identity, so a dev image can't pass as a release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-dev

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "$IMAGE:sha-$GITHUB_SHA" -f Containerfile .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          # Keyless signing writes a permanent public Rekor entry, which is intended for this repo.
          cosign sign --yes "$reference"
          echo "Pushed and signed \`$reference\`" >>"$GITHUB_STEP_SUMMARY"
