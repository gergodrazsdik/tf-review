---
name: infra

on:
  pull_request:
    paths: &infra-paths
      - "infra/**"
      - "scripts/tofu-init.sh"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths: *infra-paths

permissions:
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_allowed_repository_ids: ${{ vars.TF_REVIEW_ALLOWED_REPOSITORY_IDS }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}

jobs:
  # tf-review reviews its own infra/ like any caller: pinned to a released commit (D45), with the plan's
  # variables from PLAN_VARIABLES (D52). It skips fork PRs itself, and stays advisory (.tf-review.yml).
  plan:
    if: github.event_name == 'pull_request'
    # The rc pin is a test, and v0.0.12 replaces it before merge.
    # yamllint disable-line rule:line-length
    uses: gergodrazsdik/tf-review/.github/workflows/tf-review.yml@359b61d4a05fa000ea46cbb384b9c4412109ea6c # v0.0.12-rc.1
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: tfstate-infra
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Init
        run: scripts/tofu-init.sh
      - name: Apply
        run: tofu -chdir=infra apply -input=false -auto-approve -lock-timeout=5m
