---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install tools
        run: |
          scripts/install-ci-tools.sh just actionlint pinact gitleaks tofu tflint
          uv tool install yamllint==1.38.0
      - name: Lint
        run: just lint validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conftest tests run the real policies. A policy change reaches here by moving this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gergodrazsdik/tf-standards
          ref: 0f31069c8477e8a9fe9c01e54534dfcb0647c79a
          path: standards
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install conftest
        run: scripts/install-ci-tools.sh conftest
      - name: Test
        run: dotnet test
        env:
          TF_STANDARDS_DIR: ${{ github.workspace }}/standards
      - name: Replay the seeded cases
        run: dotnet run --project tests/TfReview.Eval -- replay
        env:
          TF_STANDARDS_DIR: ${{ github.workspace }}/standards
      # CSharpier owns the layout; dotnet format checks style and analyzers, not whitespace, so the two can't disagree.
      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .
          dotnet format style --verify-no-changes
          dotnet format analyzers --verify-no-changes

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
      - name: Build
        run: docker build -t tf-review:ci -f Containerfile .
      # The same constraints the workflow runs it under: non-root, read-only root filesystem.
      - name: Smoke test
        run: scripts/image-smoke.sh tf-review:ci
