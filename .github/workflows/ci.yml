---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install tools
        run: |
          scripts/install-ci-tools.sh just actionlint pinact gitleaks tofu tflint
          uv tool install yamllint==1.38.0
      - name: Lint
        run: just lint validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conftest tests run the real policies. A policy change reaches here by moving this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gergodrazsdik/tf-standards
          ref: adf50af6607b4e2b28a7e3566db8adfdecabe683
          path: standards
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install conftest
        run: scripts/install-ci-tools.sh conftest
      - name: Test
        run: dotnet test
        env:
          TF_STANDARDS_DIR: ${{ github.workspace }}/standards
      - name: Replay the seeded cases
        run: dotnet run --project tests/TfReview.Eval -- replay
        env:
          TF_STANDARDS_DIR: ${{ github.workspace }}/standards
      - name: Check formatting
        run: dotnet format --verify-no-changes

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
      - name: Build
        run: docker build -t tf-review:ci -f Containerfile .
      # The same constraints the workflow runs it under: non-root, read-only root filesystem.
      - name: Smoke test
        run: scripts/image-smoke.sh tf-review:ci
