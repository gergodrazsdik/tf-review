---
name: e2e-live

# Runs the seeded cases against the real model, as a PR that changes the agent has to be measured
# rather than judged. Each run costs cents. It isn't a required check, so a model outage can't block merges.
on:
  pull_request:
    paths:
      # Everything the eval's reviews run through, and what builds it: which docs an agent sees (Rag), what the
      # scanners report (Scanners), the reference retriever (Service), and the SDK and package versions.
      - "prompts/**"
      - "src/TfReview.Agents/**"
      - "src/TfReview.Core/**"
      - "src/TfReview.Rag/**"
      - "src/TfReview.Scanners/**"
      - "src/TfReview.Service/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "global.json"
      - "tests/TfReview.Eval/**"
      - "tests/fixtures/cases/**"
      - ".github/workflows/e2e-live.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case.
        type: number
        default: 5
      references:
        description: Give agents reference material from the index, which the baseline has to hold with.
        type: boolean
        default: false
      deployment:
        description: The model deployment, to compare candidates (D4). Pull requests use the repo's variable.
        type: choice
        options: [gpt-6.1-sol, gpt-5.4-mini]
        default: gpt-6.1-sol

permissions:
  contents: read

# A new push to the same PR cancels its run, and only one run of either eval workflow uses the model at a time: they
# share the production deployment's 100K tokens a minute with the service (OPS-4). A third waiting run replaces the
# second.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-live:
    # Fork PRs get no OIDC token or secrets, so they can't reach the model.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: review
    concurrency:
      group: model-evals
      cancel-in-progress: false
    # Without references, the 155 reviews of 31 cases took 5 to 20 minutes on 2026-11-04 to 11-06. No full run with
    # references per finding has been timed here; per agent, 85 reviews took about 36 minutes, which would be about
    # 66 for 155, so time the next run with references against this limit.
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gergodrazsdik/tf-standards
          ref: adf50af6607b4e2b28a7e3566db8adfdecabe683
          path: standards
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install conftest
        run: scripts/install-ci-tools.sh conftest
      - name: Build
        run: dotnet build tests/TfReview.Eval
      - name: Get a federated token
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/federated-token"
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::$token"
          printf '%s' "$token" >"$RUNNER_TEMP/federated-token"
      - name: Run the cases against the model
        env:
          RUNS: ${{ inputs.runs || 5 }}
          TF_STANDARDS_DIR: ${{ github.workspace }}/standards
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_REVIEW }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_REVIEW_OPENAI_ENDPOINT: ${{ vars.TF_REVIEW_OPENAI_ENDPOINT }}
          TF_REVIEW_OPENAI_DEPLOYMENT: ${{ inputs.deployment || vars.TF_REVIEW_OPENAI_DEPLOYMENT }}
          TF_REVIEW_COSMOS_ENDPOINT: https://cosmos-tf-review-prod.documents.azure.com:443/
          REFERENCES: ${{ inputs.references && '--references' || '' }}
        run: |
          export AZURE_FEDERATED_TOKEN_FILE="$RUNNER_TEMP/federated-token"
          # shellcheck disable=SC2086  # REFERENCES is empty or one flag.
          dotnet run --project tests/TfReview.Eval --no-build -- live --runs "$RUNS" --record "$RUNNER_TEMP/answers" \
            --suggestions "$RUNNER_TEMP/suggestions" $REFERENCES
      # What each run found and suggested, to read a run with references against one without.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: suggestions
          path: ${{ runner.temp }}/suggestions
          retention-days: 14
          if-no-files-found: warn
      # Passing answers, to commit as the replay fixtures after a prompt change.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: recorded-answers
          path: ${{ runner.temp }}/answers
          retention-days: 7
          if-no-files-found: warn
